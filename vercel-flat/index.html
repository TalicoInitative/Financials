<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJ — Financial Command Center</title>
<style>
/* ===================================================================
   Fewer surfaces. Figures sit on the page; only genuinely grouped
   content (tables, charts) gets a panel. Rules and space do the rest.
   =================================================================== */
:root{
 --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
 --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
 --bg:#0a0c0e; --panel:#101418; --panel2:#141a1f; --raised:#1a2128; --hover:#161c22; --sel:#12312c;
 --rule:#1e252b; --rule2:#2a333a;
 --text:#f3f6f8; --dim:#a2adb5; --faint:#77838b;
 --accent:#42e3ca; --accent2:#8b9bff; --accent-soft:rgba(66,227,202,.12);
 --pos:#52e3a2; --neg:#ff7d72; --warn:#ffc450; --violet:#a78bfa;
 --pos-soft:rgba(82,227,162,.13); --neg-soft:rgba(255,125,114,.13); --warn-soft:rgba(255,196,80,.13);
 --shadow:0 1px 3px rgba(0,0,0,.35);
 --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.45);
 --r:12px; --r-sm:8px; --rowh:34px;
 color-scheme:dark;
}
[data-theme="light"]{
 --bg:#f6f8f9; --panel:#ffffff; --panel2:#fbfcfd; --raised:#ffffff; --hover:#f2f5f6; --sel:#e7f6f3;
 --rule:#e5eaed; --rule2:#d2dade;
 --text:#0b1114; --dim:#57636b; --faint:#79858c;
 --accent:#0c7a6e; --accent2:#4f5fd8; --accent-soft:rgba(12,122,110,.10);
 --pos:#0f8a5f; --neg:#c93024; --warn:#8a6100; --violet:#6d4fd8;
 --shadow:0 1px 3px rgba(11,17,20,.06);
 --shadow-lg:0 2px 8px rgba(11,17,20,.08), 0 20px 48px rgba(11,17,20,.10);
 color-scheme:light;
}
[data-density="comfy"]{--rowh:42px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.6;
 -webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.money,.num,.kpi .v,.mono,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ---------------- frame ---------------- */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#frame{flex:1;display:grid;grid-template-columns:206px 1fr;min-height:0;overflow:hidden}
#app>main,#frame>main{min-width:0;overflow-y:auto;overflow-x:hidden}
#reconStrip{flex:none;position:relative;z-index:40;display:flex;align-items:center;
 background:var(--bg);border-bottom:1px solid var(--rule);padding:0 20px;min-height:54px;
 overflow-x:auto;scrollbar-width:none}
#reconStrip::-webkit-scrollbar{display:none}
#reconStrip .brand{display:flex;align-items:baseline;gap:8px;padding-right:28px;white-space:nowrap;
 font-weight:650;letter-spacing:-.02em;font-size:14px}
#reconStrip .brand .tag{font-size:8.5px;font-weight:700;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
#reconStrip .cell{display:flex;align-items:baseline;gap:9px;padding:0 26px 0 0;white-space:nowrap}
#reconStrip .lbl{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:650}
#reconStrip .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:650;
 letter-spacing:-.03em;display:inline-flex;align-items:center;gap:7px}
#reconStrip .spacer{flex:1;padding:0}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
/* ---------------- sidebar ---------------- */
#sidenav{background:var(--bg);min-height:0;border-right:1px solid var(--rule);
 overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;border-radius:var(--r-sm);
 background:transparent;color:var(--dim);font:inherit;font-size:13px;font-weight:530;cursor:pointer;
 text-align:left;line-height:1.45;transition:background .14s,color .14s}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:640}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule);display:flex;gap:3px}
/* ---------------- main ---------------- */
#frame>main{overflow-y:auto;overflow-x:hidden;min-width:0}
#topbar{flex:none;position:relative;z-index:30;display:flex;align-items:center;gap:10px;
 background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);
 border-bottom:1px solid var(--rule);padding:11px 28px;min-height:46px}
#topbar strong{font-size:13.5px;font-weight:640;letter-spacing:-.015em}
#topbar .today{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
#page{padding:30px 28px 90px;max-width:1420px;isolation:isolate}
#page>*{animation:rise .24s ease both}
/* ---------------- headings ---------------- */
.phead{margin-bottom:26px}
.phead .row{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.phead h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.04em;flex:1;min-width:190px;line-height:1.25}
.phead .sub{color:var(--dim);font-size:12.5px;margin-top:8px;max-width:74ch;line-height:1.7}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:16px;font-weight:640;letter-spacing:-.025em;margin:0 0 12px;line-height:1.35}
h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
 margin:0 0 16px;line-height:1.45}
.sectionlabel{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;
 margin:40px 0 18px;line-height:1.45;display:flex;align-items:center;gap:14px}
.sectionlabel::after{content:"";flex:1;height:1px;background:var(--rule)}
.small{font-size:11.5px;color:var(--dim);line-height:1.7}
.mutedcol{color:var(--faint)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warncol{color:var(--warn)}
.code{font-family:var(--mono);font-size:11px;color:var(--dim)}
/* ---------------- panels: only for grouped content ---------------- */
.card{background:transparent;border:0;border-radius:0}
.card.pad{padding:0}
/* a panel is reserved for things that genuinely need containing */
.card.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px}
.grid{display:grid;gap:18px}
.twocol{display:grid;gap:40px 44px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.threecol{display:grid;gap:34px 40px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
/* ---------------- FIGURES: no boxes. type on the page. ---------------- */
.kpis{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:10px;
 border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi{position:relative;background:transparent;border:0;box-shadow:none;padding:18px 26px 18px 0;min-width:0}
.kpi::after{content:"";position:absolute;left:0;right:26px;bottom:0;height:1px;background:var(--rule);opacity:.55}
.kpi:last-child::after{display:none}
.kpi:hover{transform:none}
.kpi .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;
 line-height:1.5;margin-bottom:8px;overflow-wrap:break-word}
.kpi .v{font-size:21px;font-weight:640;letter-spacing:-.04em;line-height:1.3;min-width:0;
 overflow-wrap:break-word;display:block}
.kpi .s{font-size:11px;color:var(--dim);margin-top:7px;line-height:1.6;overflow-wrap:break-word}
/* the hero: one panel, four figures inside it — a single surface, not four */
.kpis.hero{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;
 background:radial-gradient(130% 180% at 0% 0%,rgba(66,227,202,.10),transparent 55%),
  linear-gradient(155deg,var(--panel2) 0%,var(--panel) 70%);
 border:0;border-radius:var(--r);padding:4px 8px 6px 26px;margin-bottom:18px;overflow:hidden}
.kpis.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
 background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpis.hero .kpi{position:relative;padding:22px 26px;border:0}
.kpis.hero .kpi+.kpi::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:1px;background:var(--rule)}
.kpis.hero .kpi::after{display:none}
/* the focal figure carries its own chart */
.heroplot{position:relative;grid-column:1/-1;margin:0 -8px -6px -26px;padding:0;height:78px;overflow:hidden;
 border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
.heroplot svg{display:block;width:100%;height:78px}
.kpis.hero .kpi .v{font-size:28px;font-weight:660;letter-spacing:-.05em;line-height:1.2;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.tone-pos .v{color:var(--pos)} .kpi.tone-neg .v{color:var(--neg)}
.kpi.tone-warn .v{color:var(--warn)} .kpi.tone-accent .v{color:var(--accent)}
.range{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;min-width:0}
.range .pair{display:block;min-width:0}
.range .lo,.range .hi{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;
 font-weight:640;letter-spacing:-.04em;line-height:1.25;white-space:nowrap}
.range .cap{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
 font-weight:700;line-height:1.6;margin-top:3px}
.range .div{color:var(--faint);align-self:center;line-height:1}
.range .div::before{content:"–"}
.sparkwrap{margin:12px 0 2px;height:30px;line-height:0}
svg.spark{display:block;max-width:100%;height:30px}
/* ---------------- spending rows: rules, not cards ---------------- */
.catlist{display:flex;flex-direction:column}
.catrow{position:relative;background:transparent;border:0;border-bottom:1px solid var(--rule);
 border-radius:0;box-shadow:none;padding:16px 0 16px 14px;transition:padding .16s}
.catrow::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;
 background:var(--rule2);border-radius:2px;transition:background .16s}
.catrow:hover::before{background:var(--accent)}
.cathead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.catdot{width:9px;height:9px;border-radius:3px;flex:none;align-self:center}
.catname{font-weight:600;font-size:14px;letter-spacing:-.02em}
.catmeta{font-size:11px;color:var(--faint)}
.catamt{margin-left:auto;font-size:16px;font-weight:650;letter-spacing:-.035em}
.catpct{font-size:11px;color:var(--faint);min-width:36px;text-align:right}
.catbar{height:5px;background:var(--raised);border-radius:99px;overflow:hidden}
.catbar>span{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .5s cubic-bezier(.2,.8,.3,1) both}
.catbudget{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:11px;color:var(--dim)}
.catbudget.over{color:var(--neg)}
.catacts{display:flex;gap:8px;margin-top:12px}
/* ---------------- buttons ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 14px;
 border:1px solid var(--rule2);border-radius:var(--r-sm);background:transparent;color:var(--text);
 font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;line-height:1.5;
 transition:background .14s,border-color .14s,transform .1s}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--faint)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.36;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#03211d;font-weight:660}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--rule2)}
.btn.danger:hover:not(:disabled){background:var(--neg-soft);border-color:var(--neg)}
.btn.ghost{border-color:transparent;color:var(--dim)}
.btn.ghost:hover:not(:disabled){background:var(--hover);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn svg{width:14px;height:14px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
 border:0;border-radius:var(--r-sm);background:transparent;color:var(--faint);cursor:pointer;transition:.14s}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn svg{width:16px;height:16px}
/* ---------------- notices ---------------- */
.noticebar{display:flex;align-items:center;gap:12px;padding:13px 0;margin-bottom:22px;
 border-bottom:1px solid var(--rule);line-height:1.6}
.noticebar .pip{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.noticebar .txt{flex:1;font-size:12px;color:var(--dim);min-width:0}
.noticebar .txt b{color:var(--text);font-weight:640}
.noticelist{margin-bottom:24px;border-top:1px solid var(--rule)}
.noticelist .item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;
 border-bottom:1px solid var(--rule);font-size:12px;line-height:1.65}
.noticelist .item .pip{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none}
.noticelist .item .m{flex:1;color:var(--dim);min-width:0;overflow-wrap:break-word}
.pip.warn{background:var(--warn)} .pip.neg{background:var(--neg)} .pip.info{background:var(--accent)}
.banner{display:flex;align-items:flex-start;gap:12px;padding:13px 0 13px 16px;margin-bottom:16px;
 border:0;border-left:2px solid var(--rule2);background:transparent;font-size:12.5px;line-height:1.65}
.banner .bacts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;flex:none}
.banner.warn{border-left-color:var(--warn)}
.banner.neg{border-left-color:var(--neg)}
.banner.info{border-left-color:var(--accent)}
/* ---------------- spreadsheet ---------------- */
.tablewrap{border:0;border-top:1px solid var(--rule2);border-radius:0;overflow:auto;background:transparent;
 max-height:74vh;position:relative}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.dt thead th{position:sticky;top:0;z-index:3;background:var(--bg);
 border-bottom:1px solid var(--rule2);padding:12px 16px;text-align:left;
 font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;
 white-space:nowrap;cursor:pointer;user-select:none;line-height:1.5}
table.dt thead th:hover{color:var(--text)}
th.num,td.num{text-align:right}
table.dt tbody td{border-bottom:1px solid var(--rule);padding:0 16px;height:var(--rowh);
 white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;line-height:1.45}
table.dt tbody tr{transition:background .12s}
table.dt tbody tr:hover td{background:var(--hover)}
table.dt tbody tr.selected td{background:var(--sel)}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tfoot td{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--rule2);
 border-bottom:0;padding:12px 16px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5}
table.dt .pin{position:sticky;left:0;z-index:2;background:var(--bg)}
table.dt thead th.pin{z-index:6;background:var(--bg)}
table.dt tfoot td.pin{z-index:7;background:var(--bg)}
table.dt tbody tr:hover .pin{background:var(--hover)}
td.editable{cursor:text}
td.editable:hover{box-shadow:inset 0 0 0 1px var(--rule2)}
td input,td select{width:100%;background:var(--raised);border:1px solid var(--accent);border-radius:6px;
 color:var(--text);font:inherit;font-size:12.5px;padding:4px 7px;outline:none;line-height:1.45}
.empty{padding:58px 22px;text-align:center;color:var(--dim);line-height:1.75}
.empty .big{font-size:16px;font-weight:640;color:var(--text);margin-bottom:8px}
/* ---------------- filters ---------------- */
.fbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.fbar .sep{width:1px;height:22px;background:var(--rule);margin:0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;
 background:var(--accent-soft);border:0;color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.5}
.chip:hover{filter:brightness(1.2)}
/* ---------------- inputs ---------------- */
input,select,textarea{background:var(--raised);border:1px solid var(--rule2);border-radius:var(--r-sm);
 color:var(--text);font:inherit;font-size:12.5px;padding:8px 11px;outline:none;max-width:100%;
 line-height:1.5;transition:border-color .14s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{width:100%;min-height:70px;resize:vertical}
select{cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;line-height:1.5}
.field .hint{font-size:10.5px;color:var(--faint);line-height:1.6}
.formgrid{display:grid;gap:18px 22px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.check{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);cursor:pointer;line-height:1.5}
.check input{width:15px;height:15px;accent-color:var(--accent);padding:0;cursor:pointer}
fieldset{border:0;border-top:1px solid var(--rule);padding:0;margin:0 0 26px;min-width:0}
legend{display:block;float:left;width:100%;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--faint);font-weight:700;padding:20px 0 0;margin:0 0 18px;line-height:1.5}
fieldset::after{content:"";display:table;clear:both}
/* ---------------- tabs ---------------- */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--rule);margin-bottom:26px;
 overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:0 0 12px;border:0;border-bottom:2px solid transparent;background:transparent;
 color:var(--faint);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;
 margin-bottom:-1px;line-height:1.5;transition:color .14s}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:640}
.pills{display:inline-flex;gap:22px}
.pill{padding:0 0 4px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--faint);
 font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;white-space:nowrap;line-height:1.5;transition:color .14s}
.pill:hover{color:var(--text)}
.pill.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}
/* ---------------- badges ---------------- */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;
 font-weight:650;letter-spacing:.04em;white-space:nowrap;line-height:1.6}
.b-neutral{background:var(--raised);color:var(--dim)}
.b-ok{background:var(--pos-soft);color:var(--pos)}
.b-warn,.b-est{background:var(--warn-soft);color:var(--warn)}
.b-link{background:var(--accent-soft);color:var(--accent)}
.b-income{background:var(--pos-soft);color:var(--pos)}
.b-expense{background:var(--neg-soft);color:var(--neg)}
.b-loan{background:rgba(167,139,250,.15);color:var(--violet)}
.b-transfer,.b-adjust{background:var(--raised);color:var(--dim)}
/* ---------------- progress ---------------- */
.pbar{height:6px;background:var(--raised);border-radius:99px;overflow:hidden}
.pbar>span{display:block;height:100%;background:var(--accent);border-radius:99px;
 transform-origin:left;animation:grow .5s cubic-bezier(.2,.8,.3,1) both}
/* ---------------- modal ---------------- */
#modalhost{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(4px);
 display:none;align-items:center;justify-content:center;padding:24px;z-index:100}
#modalhost.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--rule2);border-radius:16px;box-shadow:var(--shadow-lg);
 width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:rise .2s ease both}
.modal.wide{width:min(940px,100%)}
.mhead{display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:1px solid var(--rule)}
.mhead h2{margin:0;font-size:15px;font-weight:640;line-height:1.4}
.mbody{padding:26px;overflow-y:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:16px 26px;border-top:1px solid var(--rule)}
/* ---------------- snack ---------------- */
#snack{position:fixed;left:50%;transform:translateX(-50%);bottom:-110px;z-index:200;
 background:var(--raised);border:1px solid var(--rule2);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);
 padding:14px 18px;display:flex;align-items:center;gap:14px;font-size:12.5px;max-width:min(560px,92vw);

function incomeSummary(fromISO,toISO){

 for(const t of rows){gross+=conv(t);fees+=t.feesCadCents||0;tax+=t.taxWithheldCadCents||0;rel+=t.relatedExpenseCadCents||0;}

   .reduce((s,t)=>s+conv(t),0);

function spendUndated(fromISO,toISO){

  &&(t.datePrecision==="month"||!t.date)

 openModal({title:"Log machine expense",body:el=>{

  el.append(g);

 buttons:[{label:"Cancel",onClick:c=>c()},{label:"Log expense",kind:"primary",onClick:c=>{

   update(s=>{const tx=blankTx({date:d.date,reportingMonth:ymOf(d.date),type:"business_expense",status:"paid",sourceName:d.vendor||d.cls,description:d.desc||d.cls,categoryId:d.cls==="Plush restock"||d.cls==="Initial inventory"?"Plush inventory":d.cls==="Software"?"AI and software":"Machine repair",businessPersonal:"business",originalAmountCents:d.amount,convertedCadAmountCents:d.amount,recognitionClass:capital?"capital_asset":(d.cls==="Plush restock"?"inventory_purchase":"cash_expense"),sourceRecordType:"machine_expense",notes:"Machine expense — "+d.cls});

   c();snack("Expense logged and allocated.");}}]});}

const CALC_GUIDE=[
 ["Gross earned income","Sum of counted earned-income transactions (business + employment) before fees and direct expenses. Loan proceeds, gifts, refunds, transfers and adjustments are never included."],
 ["Net business income","Gross earned income − fees/withheld/direct costs on income − business expense transactions. Tax payments are NOT subtracted here: they get their own line and reduce net cash flow instead, because a tax payment is not an operating cost of earning the income. Monthly Performance lists fees and business expenses on separate rows; the Forecasts panel combines them as \u201CBusiness expenses & fees\u201D, so gross minus that figure equals net business income exactly. Every deduction is recognized exactly once per posting group: in net-settlement mode the venue share and processing live on the income row (fees / related expense); in gross-receipt mode they are separate expense rows."],
 ["Net cash flow","Sum of counted net CAD impacts. Transfers between tracked accounts are zero; loan proceeds are positive cash but not income."],
 ["Savings added","Monthly net cash-flow change, labelled INFERRED until you mark the month's expenses complete and 'measured' in Monthly Performance. Never assumed equal to net business income."],
 ["Calculated ledger balance","Sum of all counted net impacts through the selected date. Month-only records are included once the date is in (or after) their month; they are never assigned an invented day."],
 ["Reconciliation difference","Actual confirmed balance − calculated ledger balance. Always visible in the top strip; explained only via an explicit adjustment entry with a reason."],
 ["Personal cash target","Plan total range − funding for the selected view (none / estimated / approved / received). Low and high are always computed independently — no midpoint exists anywhere in this app."],
 ["Required monthly savings","Remaining range ÷ fractional months to the savings target date (days ÷ 30.4375). Weekly and daily use the same day count."],
 ["Calendar-month run rate","Month-to-date total ÷ elapsed days × total days in the month."],
 ["Since-start normalized pace","Covered-period total ÷ inclusive covered days × 30.4375. Seed: Jul 7–27 = 21 inclusive days → C$3,164.75 gross, C$2,838.63 net (low confidence)."],
 ["Keep rate","Savings added ÷ gross earned income for the period; only computed when savings are measured and the balance reconciles (denominator > 0), otherwise use the manual override. Estimated gross required = required savings ÷ keep rate."],
 ["Schedule redistribution","Remaining requirement is re-divided over the months that are not yet complete. Completed months keep their actual result forever; surpluses lower later months, shortfalls raise them."],
 ["Machine gross per prize cycle","Play price × plays per prize (default C$2.00 × 4 = C$8.00). This is GROSS revenue, not profit."],
 ["Estimated plays / prizes","Gross ÷ play price; plays ÷ plays-per-prize. Actual meter or plush counts override the estimate (the estimate stays visible)."],
 ["Venue deduction","Share % × basis (gross, gross-less-processing, or custom amount)."],
 ["Plush COGS","Prizes dispensed (actual if counted, else estimated) × average plush cost. Non-cash: it reduces operating profit, never the posting group's cash."],
 ["Net operating profit","Gross − venue − plush COGS − processing − refunds − allocated period expenses − other deductions."],
 ["Net cash contribution (collection)","Gross − venue − processing − refunds = cash retained/deposited. Owner share = × ownership %."],
 ["Posting-group cash impact","The linked ledger rows of a collection always sum to the real settlement: gross-receipt = gross income + separate cash expenses; net-settlement = one net deposit with withheld parts kept on the collection record only; manual-link = existing ledger rows you tick, which are joined to the group but never created or deleted by the app. All three modes are checked against the settlement and warn if they disagree."],
 ["Initial cash invested","Purchase + shipping + card reader + installation + initial plush inventory + other setup (+ capital-class allocated expenses). Initial inventory is counted once here — its later consumption is COGS, never a second cash outflow."],
 ["Cumulative net cash contribution","Σ owner cash from collections − operating & restock cash allocated to the machine (× ownership). The initial investment is never subtracted a second time."],
 ["Payback progress / months to payback","Contribution ÷ invested (bar clamped 0–100%, overage shown as 'paid back plus C$X'; negative contribution shows 0%). Months to payback = remaining ÷ selected average monthly cash; zero or negative pace → 'No positive payback projection at the current pace'."],

 ["Dates","Business dates are ISO YYYY-MM-DD in America/Vancouver; day ranges are INCLUSIVE. Countdowns use the live date and refresh at local midnight; historical projections use the data-through date ("+"seeded Jul 27, 2026)."]];

function looksUntouched(st){
 try{
  const seedIds=seedRowIds();
  const txs=st.transactions||[];
  if(txs.some(t=>!seedIds.has(t.id)))return false;          // user added rows
  if((st.collections||[]).length||(st.machines||[]).length)return false;
  if(Object.keys(st.budgets||{}).length)return false;
  if((st.reconciliations||[]).length)return false;
  if((st.locations||[]).length||(st.inventoryLots||[]).length)return false;
  // a balance the user typed is real work even with no transactions yet
  if((st.accounts||[]).some(a=>(a.manuallyConfirmedBalanceCents||0)!==0))return false;
  if((st.accounts||[]).length>1)return false;                       // they added accounts
  if(Object.keys(st.balanceCheckpoints||{}).length)return false;     // month-end balances
  if(Object.keys(st.monthFlags||{}).length)return false;
  if((st.milestones||[]).some(m=>m.id!=="ms-move"&&m.id!=="ms-save"))return false;
  return true;
